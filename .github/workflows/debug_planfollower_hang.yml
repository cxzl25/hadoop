# TEMPORARY debugging workflow, not for merge: reproduces the
# TestFairSchedulerPlanFollower hang in the same image and with the same Maven
# arguments as tmpl_build_and_test.yml, and captures thread dumps when it hangs.
name: Debug PlanFollower hang

on:
  push:
    branches:
      - "debug/yarn-planfollower-hang-repro"
  workflow_dispatch:

permissions:
  packages: read

env:
  MAVEN_ARGS:
    --batch-mode
    --no-transfer-progress
    -Pyarn-ui
    -Pnative
    -Drequire.test.libhadoop
    -Drequire.fuse
    -Drequire.openssl
    -Drequire.snappy
    -Drequire.valgrind
    -Dmaven.test.failure.ignore=false
    -Dsurefire.rerunFailingTestsCount=2

jobs:
  precondition:
    name: Preparation
    runs-on: ubuntu-24.04
    outputs:
      build_image_url: ${{ steps.variables.outputs.build_image_url }}
    steps:
      - name: Set up Outputs
        id: variables
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "build_image_url=ghcr.io/${REPO_OWNER}/gha-build-ubuntu_24:trunk-${{ github.run_id }}" >> $GITHUB_OUTPUT
  build-image:
    name: Build Image
    runs-on: ubuntu-24.04
    needs: [ precondition ]
    permissions:
      packages: write
    outputs:
      uid: ${{ steps.variables.outputs.uid }}
    steps:
      - uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push base build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dev-support/docker/
          file: ./dev-support/docker/Dockerfile_ubuntu_24
          push: true
          tags: ${{ needs.precondition.outputs.build_image_url }}-base
          cache-from: type=registry,ref=ghcr.io/apache/hadoop/gha-build-ubuntu_24-image-cache:trunk
      - name: User-specific Dockerfile
        run: |
          USER_ID=$(id -u "${USER}")
          GROUP_ID=$(id -g "${USER}")
          cat > /tmp/Dockerfile.gha <<UserSpecificDocker
          FROM ${{ needs.precondition.outputs.build_image_url }}-base
          RUN rm -f /var/log/faillog /var/log/lastlog
          RUN groupadd --non-unique -g ${GROUP_ID} ${USER}
          RUN useradd -g ${GROUP_ID} -u ${USER_ID} -k /root -m ${USER}
          RUN echo "${USER} ALL=NOPASSWD: ALL" > "/etc/sudoers.d/hadoop-build-${USER_ID}"
          UserSpecificDocker
      - name: Build and push build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dev-support/docker/
          file: /tmp/Dockerfile.gha
          push: true
          tags: ${{ needs.precondition.outputs.build_image_url }}
      - name: Set up Outputs
        id: variables
        run: |
          echo "uid=$(id -u "${USER}")" >> $GITHUB_OUTPUT
  repro:
    name: Repro ${{ matrix.name }} #${{ matrix.shard }}
    runs-on: ubuntu-24.04
    needs: [ precondition, build-image ]
    timeout-minutes: 100
    container:
      image: ${{ needs.precondition.outputs.build_image_url }}
      options: --user ${{ needs.build-image.outputs.uid }} --cap-add=SYS_PTRACE
    strategy:
      fail-fast: false
      matrix:
        name: [ single ]
        shard: [ 1, 2, 3, 4, 5, 6 ]
        selector: [ "TestFairSchedulerPlanFollower" ]
        limit: [ 300 ]
        include:
          # The whole reservation package, closer to what the fork JVMs and the
          # Maven JVM look like in a full module run.
          - name: reservation
            shard: 1
            selector: "org/apache/hadoop/yarn/server/resourcemanager/reservation/**/Test*"
            limit: 1200
          - name: reservation
            shard: 2
            selector: "org/apache/hadoop/yarn/server/resourcemanager/reservation/**/Test*"
            limit: 1200
    steps:
      - name: Checkout Hadoop repository
        uses: actions/checkout@v6
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: 'maven'
          check-latest: false
      - name: Install gdb (best effort)
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb || true
      - name: Build
        shell: bash
        run: ./mvnw $MAVEN_ARGS -pl :hadoop-yarn-server-resourcemanager clean install -am -DskipTests
      - name: Repro loop
        shell: bash
        run: bash .github/debug/repro-loop.sh "${{ matrix.selector }}" 60 ${{ matrix.limit }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hang-diag-${{ matrix.name }}-${{ matrix.shard }}
          path: hang-diag/**
